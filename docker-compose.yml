services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: turjman
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: mydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"  # only accessible from inside the VPS
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turjman -d mydb"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/motarjm/motarjm:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
