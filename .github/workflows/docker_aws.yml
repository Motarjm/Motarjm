name: Build and deploy to Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_name: ${{ steps.lowercase.outputs.image_name }}

    steps:
      - uses: actions/checkout@v4

      - name: Lowercase image name
        id: lowercase
        run: echo "image_name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image tag
        id: meta
        run: echo "image_tag=$(echo $GITHUB_SHA | head -c7)" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          build-args: |
            VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}:${{ steps.meta.outputs.image_tag }}
            ${{ env.REGISTRY }}/${{ steps.lowercase.outputs.image_name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build_and_push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate .env file
        run: |
          cat > .env.deploy <<EOF
          IMAGE_TAG=${{ needs.build_and_push.outputs.image_tag }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          HUGGINGFACE_API_KEY=${{ secrets.HUGGINGFACE_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          LANGSMITH_API_KEY=${{ secrets.LANGSMITH_API_KEY }}
          VITE_POSTHOG_API_KEY=${{ secrets.VITE_POSTHOG_API_KEY }}
          EXA_API_KEY=${{ secrets.EXA_API_KEY }}
          LANGSMITH_TRACING=true
          DISABLE_MODEL_SOURCE_CHECK=True
          LMNR_PROJECT_API_KEY=${{ secrets.LMNR_PROJECT_API_KEY }}
          LANGFUSE_SECRET_KEY=${{ secrets.LANGFUSE_SECRET_KEY }}
          LANGFUSE_PUBLIC_KEY=${{ secrets.LANGFUSE_PUBLIC_KEY }}
          LANGFUSE_BASE_URL=${{ secrets.LANGFUSE_BASE_URL }}
          EOF

      - name: Copy files to server
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          source: "docker-compose.yml,.env.deploy"
          target: "/home/ubuntu/turjman-deploy"

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ubuntu
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -euo pipefail
            
            cd /home/ubuntu/turjman-deploy

            # Atomically replace .env with the new one shipped from GitHub
            mv .env.deploy .env
            chmod 600 .env

            # Log in to GHCR to pull the private image
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            # Pull the new app image
            docker compose pull app

            # Backup database before migrating
            docker compose exec -T db pg_dump -U turjman turjman > backup_$(date +%Y%m%d%H%M%S).sql || true
            
            # only leave most recent 5 backups
            ls -1t backup_*.sql | tail -n +6 | xargs -r rm --

            # Run migrations
            docker compose run --rm app alembic upgrade head

            # Recreate containers so they pick up the new .env and new image
            docker compose up -d --force-recreate

            # Clean up old images
            docker image prune -f
